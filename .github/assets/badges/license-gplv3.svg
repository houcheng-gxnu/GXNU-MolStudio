<svg xmlns="http://www.w3.org/2000/svg" width="92" height="20" role="img" aria-label="license: GPLv3">
  <title>license: GPLv3</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="92" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="50" height="20" fill="#555"/>
    <rect x="50" width="42" height="20" fill="#007ec6"/>
    <rect width="92" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11">
    <text x="25" y="15" fill="#010101" fill-opacity=".3">license</text>
    <text x="25" y="14">license</text>
    <text x="71" y="15" fill="#010101" fill-opacity=".3">GPLv3</text>
    <text x="71" y="14">GPLv3</text>
  </g>
</svg>
